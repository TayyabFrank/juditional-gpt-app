    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JudicialGPT - AI-Powered Judicial Intelligence & Legal Research</title>
    <meta name="description" content="Search case law, statutes, and precedents in seconds with JudicialGPT. Multilingual AI judicial intelligence for Pakistani and common law legal research." />

    <!-- Google Fonts for Typography & Regional Pakistani Languages -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600;1,700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Sleek Modern Dark Scrollbars */
      *::-webkit-scrollbar,
      ::-webkit-scrollbar {
        width: 6px !important;
        height: 6px !important;
      }
      *::-webkit-scrollbar-track,
      ::-webkit-scrollbar-track {
        background: #0f172a !important;
        border-radius: 8px !important;
      }
      *::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-thumb {
        background: #10b981 !important;
        background-image: linear-gradient(180deg, #10b981 0%, #059669 100%) !important;
        border-radius: 8px !important;
        border: 1px solid rgba(16, 185, 129, 0.25) !important;
      }
      *::-webkit-scrollbar-thumb:hover,
      ::-webkit-scrollbar-thumb:hover {
        background: #34d399 !important;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.7) !important;
      }
      *::-webkit-scrollbar-button,
      ::-webkit-scrollbar-button {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      * {
        scrollbar-width: thin !important;
        scrollbar-color: #10b981 #0f172a !important;
      }
    </style>
  </head>
